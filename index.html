<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Timetable-aware attendance tracker and planner for college students" />
    <title>ClassTrack — Attendance Planner</title>
    <script>
      // Restores the path 404.html stashed before redirecting here (see public/404.html).
      var redirectPath = sessionStorage.getItem('spa-redirect-path')
      if (redirectPath) {
        sessionStorage.removeItem('spa-redirect-path')
        history.replaceState(null, '', location.pathname.replace(/\/$/, '/') + redirectPath)
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
